name: ViewTurbo Daily Checkin

on:
  schedule:
    # UTC 16:10 = 北京时间 00:10，每天执行
    - cron: '10 16 * * *'
  workflow_dispatch: # 允许手动触发测试

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run checkin
        env:
          VT_ACCOUNTS: ${{ secrets.VT_ACCOUNTS }}
        run: python checkin.py